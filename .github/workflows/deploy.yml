name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # v1.3.3 起：先校验，后部署。语法或测试任何一项失败都不会发布。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dev dependencies (jsdom)
        run: npm ci
      - name: Syntax check all JS
        run: |
          find js -name '*.js' -exec node --check {} \;
          node --check sw.js
      - name: Run regression tests
        run: npm test

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      # ⚠️ 已知风险（P0 待修，见 IMPROVEMENT_PLAN.md 阶段 A）：
      # path: '.' 会把仓库根目录整个发布到 Pages，敏感文件必须靠 .gitignore/不入库来兜底。
      # 修复方向：改为显式白名单目录。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
